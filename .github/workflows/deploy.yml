name: Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_SSH_HOST }}
      EC2_USER: ${{ secrets.EC2_SSH_USER }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build Spring Boot JAR
        run: |
          chmod +x gradlew
          ./gradlew clean build

      - name: Prepare SSH access
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release JAR
        id: upload
        run: |
          JAR_PATH=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)
          test -n "$JAR_PATH"
          REMOTE_JAR="/tmp/scenik-backend-${GITHUB_SHA}.jar"
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "$JAR_PATH" "$EC2_USER@$EC2_HOST:$REMOTE_JAR"
          echo "remote_jar=$REMOTE_JAR" >> "$GITHUB_OUTPUT"

      - name: Activate release and verify health
        env:
          REMOTE_JAR: ${{ steps.upload.outputs.remote_jar }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "$EC2_USER@$EC2_HOST" "bash -s -- '$REMOTE_JAR'" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          new_jar="$1"
          app_dir=/opt/scenik/backend
          current_jar="$app_dir/app.jar"
          previous_jar="$app_dir/app.jar.previous"

          sudo test -f "$new_jar"
          sudo cp "$current_jar" "$previous_jar"
          sudo install -o root -g scenik -m 0640 "$new_jar" "$app_dir/app.jar.next"
          sudo mv "$app_dir/app.jar.next" "$current_jar"

          if ! sudo systemctl restart scenik-backend; then
            sudo mv "$previous_jar" "$current_jar"
            sudo systemctl restart scenik-backend
            exit 1
          fi

          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/v3/api-docs; then
              sudo rm -f "$previous_jar" "$new_jar"
              exit 0
            fi
            sleep 5
          done

          sudo mv "$previous_jar" "$current_jar"
          sudo systemctl restart scenik-backend
          exit 1
          REMOTE_SCRIPT
