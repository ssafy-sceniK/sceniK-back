spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: scenik-backend
  profiles:
    default: local
  security:
    oauth2:
      client:
        registration:
          google:
            scope:
              - openid
              - profile
              - email
          kakao:
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - profile_image
              - account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8080}

scenik:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  upload-dir: ${UPLOAD_DIR:uploads}
  oauth:
    frontend-redirect-uri: ${OAUTH_FRONTEND_REDIRECT_URI:http://127.0.0.1:5173/oauth/callback}
  password-reset:
    frontend-url: ${PASSWORD_RESET_FRONTEND_URL:http://127.0.0.1:5173/password-reset}
  ai:
    route:
      min-places-per-day: ${AI_ROUTE_MIN_PLACES_PER_DAY:2}
      preferred-places-per-day: ${AI_ROUTE_PREFERRED_PLACES_PER_DAY:3}
      max-places-per-day: ${AI_ROUTE_MAX_PLACES_PER_DAY:5}
    gms:
      base-url: ${GMS_BASE_URL:https://gms.ssafy.io/gmsapi/}
      api-key: ${GMS_KEY:}
      model: ${GMS_MODEL:gpt-5.4-mini}
      translation-model: ${GMS_TRANSLATION_MODEL:gemini-2.5-flash-lite}
      translation-fallback-model: ${GMS_TRANSLATION_FALLBACK_MODEL:}
      connect-timeout-ms: ${GMS_CONNECT_TIMEOUT_MS:1000}
      read-timeout-ms: ${GMS_READ_TIMEOUT_MS:5000}
