spring:
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/scenik?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:your_mysql_username}
    password: ${DB_PASSWORD:your_mysql_password}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:your_google_client_id}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:your_google_client_secret}
            scope: openid,profile,email
            redirect-uri: "${OAUTH_BASE_URL:http://localhost:8080}/login/oauth2/code/{registrationId}"
          kakao:
            client-id: ${KAKAO_OAUTH_CLIENT_ID:your_kakao_rest_api_key}
            client-secret: ${KAKAO_OAUTH_CLIENT_SECRET:your_kakao_client_secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH_BASE_URL:http://localhost:8080}/login/oauth2/code/{registrationId}"
            scope: profile_nickname,profile_image,account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

scenik:
  oauth:
    frontend-redirect-uri: ${OAUTH_FRONTEND_REDIRECT_URI:http://127.0.0.1:5173/oauth/callback}
  ai:
    gms:
      base-url: ${GMS_BASE_URL:https://gms.ssafy.io/gmsapi/}
      api-key: ${GMS_KEY:}
      model: ${GMS_MODEL:gpt-5.4-mini}
      translation-model: ${GMS_TRANSLATION_MODEL:gemini-2.5-flash-lite}
      translation-fallback-model: ${GMS_TRANSLATION_FALLBACK_MODEL:}
      connect-timeout-ms: ${GMS_CONNECT_TIMEOUT_MS:1000}
      read-timeout-ms: ${GMS_READ_TIMEOUT_MS:5000}

# Copy this file to application-local.yml or provide environment variables.
# Do not commit real credentials, API keys, or secrets.
