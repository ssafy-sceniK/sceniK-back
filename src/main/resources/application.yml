spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: scenik-backend
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:not-configured}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "${OAUTH_BASE_URL:http://localhost:8080}/login/oauth2/code/{registrationId}"
          kakao:
            client-id: ${KAKAO_OAUTH_CLIENT_ID:not-configured}
            client-secret: ${KAKAO_OAUTH_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH_BASE_URL:http://localhost:8080}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
              - account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/scenik?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

scenik:
  oauth:
    frontend-redirect-uri: ${OAUTH_FRONTEND_REDIRECT_URI:http://127.0.0.1:5173/oauth/callback}
